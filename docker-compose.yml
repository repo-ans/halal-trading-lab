# The app database is Supabase (hosted) -- there is deliberately no Postgres service
# for it here. See CLAUDE.md section 2. The one exception is db_test below: a
# throwaway local database that ONLY DB-writing tests use, gated behind the "test"
# profile so `docker compose up` (no --profile) never starts it.
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halal_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
