# The app database is Supabase (hosted) -- there is deliberately no Postgres service
# for it here. See CLAUDE.md section 2. The one exception is db_test below: a
# throwaway local database that ONLY DB-writing tests use, gated behind the "test"
# profile so `docker compose up` (no --profile) never starts it.
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halal_test
    ports:
      - "127.0.0.1:5433:5432"  # loopback only -- a bare "5433:5432" binds 0.0.0.0,
                               # reachable from the rest of the LAN with postgres/postgres.
                               # IPv4 only: Docker Desktop on this stack doesn't honor an
                               # "[::1]:..." binding, so always connect with the literal
                               # "127.0.0.1", never the hostname "localhost" (which
                               # resolves to the IPv6 loopback first and stalls every
                               # connection before falling back) -- see app/config.py.
    tmpfs:
      - /var/lib/postgresql/data

  # The isolated demo environment (CLAUDE.md, app/demo_mode.py): a local,
  # PERSISTENT database -- unlike db_test's tmpfs, this one is meant to survive
  # restarts between demos. Gated behind "demo" so `docker compose up` never
  # starts it either. scripts/seed_demo.py seeds it; it never receives real
  # compliance data, only fixtures.
  db_demo:
    image: postgres:17-alpine
    profiles: ["demo"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halal_demo
    ports:
      - "127.0.0.1:5434:5432"  # loopback only, IPv4 -- see db_test's comment above
    volumes:
      - demo_pgdata:/var/lib/postgresql/data

volumes:
  demo_pgdata:
